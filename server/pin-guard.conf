# /etc/kopia/pin-guard.conf - settings for kopia-pin-guard (sourced by bash).
# For every source, the newest snapshot in each of the last N buckets gets an
# administrator pin. Pinned snapshots survive any client-driven retention run.
# Set a value to 0 to disable that bucket.
GUARD_DAILY=7
GUARD_WEEKLY=8
GUARD_MONTHLY=12
GUARD_ANNUAL=3
