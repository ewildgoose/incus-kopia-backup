# /etc/incus-backup.conf - host-side configuration for incus-kopia-backup.
# Sourced by bash. Quote every value.

# Kopia repository server URL.
KOPIA_SERVER_URL="https://kopia.nippynetworks.lan:51515"

# SHA-256 fingerprint of the server TLS certificate: 64 lowercase hex characters,
# no colons. Print it on the server with: kopia-server-fingerprint
KOPIA_SERVER_FINGERPRINT="REPLACE_WITH_SERVER_CERT_SHA256"

# Trusted-host administrative identity: KOPIA_ADMIN_USERNAME@KOPIA_ADMIN_HOSTNAME.
# Create it on the server with:
#   kopia-server-add-host <this-host-fqdn>
# and store the printed password in KOPIA_ADMIN_PASSWORD_FILE (mode 0600).
# If the file is absent, incus-backup-provision prompts for the password.
KOPIA_ADMIN_USERNAME="admin"
KOPIA_ADMIN_HOSTNAME="$(hostname -f 2>/dev/null || hostname)"
KOPIA_ADMIN_PASSWORD_FILE="/etc/incus-backup/admin.password"
KOPIA_ADMIN_CONFIG="/etc/incus-backup/admin.repository.config"

# Local paths.
KOPIA_BIN="/usr/bin/kopia"
CREDENTIAL_DIR="/etc/incus-backup/credentials"
POLICY_DIR="/etc/incus-backup/policies.d"
STATE_DIR="/var/lib/incus-backup"
LOCK_DIR="/run/incus-backup"
LOG_DIR="/var/log/incus-backup"

# Paths inside the guest. REMOTE_RUNTIME_DIR holds the injected binary, config
# and password for the duration of one run. It must allow execution (no noexec).
REMOTE_RUNTIME_DIR="/run/incus-backup"
# Persistent Kopia cache inside the guest. Keep it excluded from backups.
REMOTE_CACHE_DIR="/var/cache/kopia"

# Scheduler. An instance is only considered when user.backup.enabled=true.
DEFAULT_INTERVAL="24h"
# Backups the scheduler runs at the same time.
MAX_JOBS=1
# Do not start another backup when (1-minute load / CPU count) is at or above
# this value. 0 disables load gating.
MAX_NORMALIZED_LOAD="1.25"

# Guest cache sizes in MB. Per-instance user.backup.cache.* keys override these.
DEFAULT_METADATA_CACHE_MB=64
DEFAULT_METADATA_CACHE_LIMIT_MB=128
DEFAULT_CONTENT_CACHE_MB=32
DEFAULT_CONTENT_CACHE_LIMIT_MB=64

# Default policy classes (files in POLICY_DIR). Per-instance
# user.backup.policy.root / user.backup.policy.data override these.
DEFAULT_ROOT_POLICY="root-server"
DEFAULT_DATA_POLICY="data"

# Seconds incus-backup-provision waits for the server to accept a new or
# changed backup user. The server reloads users every --refresh-interval.
PROVISION_AUTH_TIMEOUT=120
