# Policy class: iot
# Root filesystem of a general machine or IoT host. Same transient exclusions
# as root-server, but local logs are kept because they are not centralized.
IGNORE=(
    "/tmp/"
    "/var/tmp/"
    "/var/cache/"
    "/var/backup/"
    "/run/"
    "/proc/"
    "/sys/"
    "/dev/"
    ".ccache/"
    ".recycle/"
    "core.*"
)
ONE_FILE_SYSTEM="true"
IGNORE_CACHE_DIRS="false"
KEEP_LATEST=10
KEEP_HOURLY=24
KEEP_DAILY=14
KEEP_WEEKLY=8
KEEP_MONTHLY=12
KEEP_ANNUAL=3
COMPRESSION="none"
