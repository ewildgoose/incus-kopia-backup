# Policy class: root-server
# Root filesystem of an ordinary application server whose logs are centralized.
# Sourced by incus-backup-provision (bash). Patterns use Kopia ignore syntax:
# a leading "/" anchors to the snapshot root, a trailing "/" matches directories.
IGNORE=(
    "/tmp/"
    "/var/tmp/"
    "/var/cache/"
    "/var/backup/"
    "/var/log/"
    "/run/"
    "/proc/"
    "/sys/"
    "/dev/"
    ".ccache/"
    ".recycle/"
    "core.*"
)
ONE_FILE_SYSTEM="true"
# A guest could hide directories by planting CACHEDIR.TAG files. Keep false.
IGNORE_CACHE_DIRS="false"
KEEP_LATEST=10
KEEP_HOURLY=24
KEEP_DAILY=14
KEEP_WEEKLY=8
KEEP_MONTHLY=12
KEEP_ANNUAL=3
COMPRESSION="none"
